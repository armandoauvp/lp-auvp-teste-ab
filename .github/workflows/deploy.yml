name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite republicar sem precisar de um commit novo.
  workflow_dispatch:

# Só uma publicação por vez. `cancel-in-progress: false` deixa a que já está
# rodando terminar: cancelar no meio pode deixar o site parcialmente atualizado.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build estático
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Descobre o endereço real das Pages deste repositório. É daqui que saem
      # o subcaminho e a URL canônica. Assim, no dia em que um domínio próprio
      # for configurado, o build se ajusta sozinho, sem editar nada.
      - name: Descobrir configuração do Pages
        id: pages
        uses: actions/configure-pages@v5

      # Um único install cobre as duas páginas (npm workspaces).
      - name: Instalar dependências
        run: npm ci

      # Gera dist/ com a Escola na raiz, institucional/ e as demais páginas. O .nojekyll também
      # sai daqui. Ver scripts/build.mjs.
      - name: Build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
