name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Escotilha manual, igual à do deploy. Quando a Actions para de agendar os
  # runs automáticos, e isso já aconteceu, um PR fica sem verificação nenhuma e
  # sem jeito de pedir uma: `push` e `pull_request` não se disparam à mão.
  workflow_dispatch:

jobs:
  verificacao:
    name: Tipos, lint, formatação, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

      - name: Testes da Escola
        run: npm test

      # Também confere os testes A/B (experiments.json, b.html e canonical).
      # Ver docs/AB-TESTING.md.
      - name: Build
        run: npm run build
