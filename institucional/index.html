    <!--
      Sentient (Fontshare / Indian Type Foundry). É a serifa do logotipo da
      AUVP e, por isso, a serifa do site. Os .woff2 (400, 500 e 700) ficam em
      public/fonts/ e são servidos pelo próprio site: buscar a folha de estilo
      no api.fontshare.com segurava a primeira pintura em ~750 ms no celular
      (PageSpeed). A licença permite hospedar os arquivos. Os @font-face estão
      em src/globals.css. O 500 é o peso do título da dobra inicial.
    -->
    <link
      rel="preload"
      href="/fonts/sentient-500.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
